version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: greatescapemn-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: greatescapemn
      POSTGRES_PASSWORD: greatescapemn
      POSTGRES_DB: greatescapemn
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data:
